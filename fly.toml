# fly.toml — Wind Check backend
# Deploy with: fly deploy --config fly.toml

app = "windcheck-backend"
primary_region = "iad"  # Washington DC — closest to aviationweather.gov

[build]
  dockerfile = "backend/Dockerfile"

[env]
  TAF_DB_PATH = "/data/taf_accuracy.db"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = false   # keep running so scheduler never sleeps
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source      = "windcheck_data"
  destination = "/data"
  initial_size = "1gb"
